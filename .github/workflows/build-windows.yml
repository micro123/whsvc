name: Build Windows self-contained

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "WallhavenService.csproj"
  RUNTIME_IDENTIFIER: "win-x64"
  PUBLISH_DIRECTORY: "${{ github.workspace }}\\artifacts\\publish\\win-x64"
  INSTALLER_DIRECTORY: "${{ github.workspace }}\\artifacts\\installer"

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore $env:PROJECT_PATH --runtime $env:RUNTIME_IDENTIFIER

      - name: Publish self-contained application
        shell: pwsh
        run: >-
          dotnet publish $env:PROJECT_PATH
          --configuration Release
          --runtime $env:RUNTIME_IDENTIFIER
          --self-contained true
          --no-restore
          --output $env:PUBLISH_DIRECTORY
          -p:Platform=x64
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false


      - name: Validate WinUI publish output
        shell: pwsh
        run: |
          $requiredFiles = @(
            "WallhavenService.exe",
            "WallhavenService.pri",
            "App.xbf",
            "MainWindow.xbf",
            "ImagePreviewWindow.xbf",
            "LogWindow.xbf"
          )

          $missingFiles = $requiredFiles | Where-Object {
            -not (Test-Path -LiteralPath (Join-Path $env:PUBLISH_DIRECTORY $_) -PathType Leaf)
          }

          if ($missingFiles) {
            throw "Published WinUI files are missing: $($missingFiles -join ', ')"
          }

      - name: Create ZIP package
        id: package
        shell: pwsh
        run: |
          $archiveName = "WallhavenService-$env:RUNTIME_IDENTIFIER.zip"
          $archivePath = Join-Path "${{ github.workspace }}\artifacts" $archiveName

          if (Test-Path -LiteralPath $archivePath) {
            Remove-Item -LiteralPath $archivePath -Force
          }

          Compress-Archive `
            -Path (Join-Path $env:PUBLISH_DIRECTORY '*') `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Download Chinese installer language
        shell: pwsh
        run: |
          $languageFile = Join-Path $env:GITHUB_WORKSPACE "installer\ChineseSimplified.isl"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" `
            -OutFile $languageFile
          if (-not (Test-Path -LiteralPath $languageFile)) {
            throw "ChineseSimplified.isl was not downloaded."
          }

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          $version = "0.1.0.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
            if ($tagVersion -match '^\d+(\.\d+){1,3}$') {
              $version = $tagVersion
            }
          }

          New-Item -ItemType Directory -Path $env:INSTALLER_DIRECTORY -Force | Out-Null
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "installer\WallhavenService.iss"
          & $iscc `
            "/DAppVersion=$version" `
            "/DSourceDir=$env:PUBLISH_DIRECTORY" `
            "/DOutputDir=$env:INSTALLER_DIRECTORY" `
            "/DLanguageFile=$env:GITHUB_WORKSPACE\installer\ChineseSimplified.isl" `
            $scriptPath
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installerPath = Get-ChildItem -LiteralPath $env:INSTALLER_DIRECTORY -Filter "*.exe" -File | Select-Object -First 1
          if (-not $installerPath) {
            throw "Installer executable was not generated."
          }
          "installer_path=$($installerPath.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WallhavenService-installer-${{ github.run_number }}
          path: ${{ steps.installer.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WallhavenService-win-x64-${{ github.run_number }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: WallhavenService-installer-${{ github.run_number }}
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: WallhavenService-win-x64-${{ github.run_number }}
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --repo "${{ github.repository }}" \
            --title "Wallhaven Service ${{ github.ref_name }}" \
            --generate-notes
